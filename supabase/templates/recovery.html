<!doctype html>
<html lang="id">
  <body style="margin:0;padding:0;background:#f6f3f4;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f3f4;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;padding:32px 28px;font-family:Arial,Helvetica,sans-serif;color:#1c1917;">
            <tr>
              <td>
                <img src="https://airtek.my.id/brand/airtek-logo.png" alt="Airtek" width="180" style="display:block;height:auto;border:0;" />
                <p style="margin:24px 0 8px;font-size:16px;">Halo,</p>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
                  Ada permintaan untuk mengatur ulang kata sandi akun <strong>{{ .Email }}</strong> di <strong>Airtek CRM</strong>.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/id/reset-password" style="display:inline-block;background:#9a1b4b;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:6px;">Atur ulang kata sandi</a>
                </p>
                <p style="margin:0 0 16px;font-size:13px;color:#78716c;">Jika Anda tidak meminta ini, abaikan email ini. Tautan berlaku terbatas.</p>
                <p style="margin:0;font-size:12px;color:#78716c;">Airtek CRM · PT. Airtek Solusi Nusantara</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
