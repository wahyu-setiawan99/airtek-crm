<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9a1b4b" />
    <title>Offline · Airtek CRM</title>
    <style>
      :root { color-scheme: light dark; --bg: #faf9fb; --fg: #2a2633; --muted: #6f6a7a; --chip: #f6e9ee; --primary: #9a1b4b; --on-primary: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1b1824; --fg: #f2f1f5; --muted: #b7b2c2; --chip: #3a2b3a; --primary: #f17d97; --on-primary: #1d1626; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
      main { max-width: 22rem; }
      .icon { width: 56px; height: 56px; margin: 0 auto; border-radius: 999px; display: grid; place-items: center; background: var(--chip); color: var(--primary); }
      h1 { margin: 20px 0 8px; font-size: 1.25rem; letter-spacing: -0.01em; }
      p { margin: 4px 0; font-size: 0.875rem; line-height: 1.5; color: var(--muted); }
      a { display: inline-flex; align-items: center; height: 44px; margin-top: 24px; padding: 0 24px; border-radius: 10px; background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 0.875rem; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M2 8.82a15 15 0 0 1 4.17-2.65" /><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" /><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" /><path d="M5 13a10 10 0 0 1 5.24-2.76" /><path d="m2 2 20 20" /></svg>
      </div>
      <h1>You are offline</h1>
      <p>Connect to the internet to open your CRM data.</p>
      <p lang="id">Anda sedang offline — sambungkan internet untuk membuka data CRM.</p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
